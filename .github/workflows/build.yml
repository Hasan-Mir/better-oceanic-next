name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Releasing a tag only makes sense when both builds carry the same version.
      - name: Verify tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          JB=$(sed -n 's/^version = "\(.*\)"$/\1/p' jetbrains/build.gradle.kts | head -1)
          echo "tag=$TAG vscode=$PKG jetbrains=$JB"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$JB" ]; then
            echo "::error::Tag v$TAG does not match package.json ($PKG) and jetbrains/build.gradle.kts ($JB). Bump both before tagging."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build VS Code extension
        run: |
          npm ci
          npx vsce package

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build JetBrains plugin
        uses: gradle/actions/setup-gradle@v4
      - run: |
          cd jetbrains
          ./gradlew buildPlugin

      - name: Upload VS Code extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: '*.vsix'

      - name: Upload JetBrains plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: jetbrains-plugin
          path: jetbrains/build/distributions/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
